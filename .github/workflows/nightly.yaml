name: Nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  orthogonality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghc: ghc9103
            shard: 1/3
          - ghc: ghc9124
            shard: 2/3
          - ghc: ghc9141
            shard: 3/3
    name: Orthogonality of the settings on ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: tilia
          authToken: '${{ secrets.CACHIX_TIILA_AUTH_TOKEN }}'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/cabal/packages/*/*
            !~/.cache/cabal/packages/*/01-index.*
            !~/.cache/cabal/packages/*/*.json
          key: cabal-${{ matrix.ghc }}-${{ hashFiles('cabal.project', 'tilia.cabal') }}
          restore-keys: |
            cabal-${{ matrix.ghc }}-
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/tilia/*
            !~/.cache/tilia/corpus
          key: tilia-${{ matrix.ghc }}-${{ hashFiles('cabal.project', 'tilia.cabal', 'src/**') }}
          restore-keys: |
            tilia-${{ matrix.ghc }}-
      - uses: actions/cache@v6
        with:
          path: ~/.cache/tilia/corpus
          key: corpus-${{ hashFiles('tests/Tilia/Corpus.hs') }}
          restore-keys: |
            corpus-
      - name: Test
        run: |
          tests="$(nix build -L --no-link --print-out-paths .#${{ matrix.ghc }}.tests-exe)"
          nix develop -L .#${{ matrix.ghc }} -c bash -c "cabal update && TILIA_ORTHOGONALITY=1 TILIA_SHARD=${{ matrix.shard }} $tests/bin/tests"
