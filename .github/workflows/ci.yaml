name: CI
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Checks
        run: |
          nix build -L --keep-going .#lint
  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghc: ghc9103
            shard: 1/3
          - ghc: ghc9124
            shard: 2/3
          - ghc: ghc9141
            shard: 3/3
    name: Build and test on ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: tilia
          authToken: '${{ secrets.CACHIX_TIILA_AUTH_TOKEN }}'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/cabal/packages
            !~/.cache/cabal/packages/hackage.haskell.org/01-index.*
          key: cabal-${{ matrix.ghc }}-${{ hashFiles('corpora/hackage/hackage.manifest', 'cabal.project', 'tilia.cabal') }}
          restore-keys: |
            cabal-${{ matrix.ghc }}-
      - uses: actions/cache@v6
        with:
          path: ~/.cache/tilia
          key: tilia-${{ matrix.ghc }}-${{ hashFiles('corpora/hackage/hackage.manifest', 'cabal.project', 'tilia.cabal', 'src/**') }}
          restore-keys: |
            tilia-${{ matrix.ghc }}-
      - name: Build
        run: |
          nix build -L --keep-going .#${{ matrix.ghc }}.ci
      - name: Test
        run: |
          tests="$(nix build --no-link --print-out-paths .#${{ matrix.ghc }}.tests-exe)"
          nix develop -L .#${{ matrix.ghc }} -c bash -c "cabal update && TILIA_SHARD=${{ matrix.shard }} $tests/bin/tests"
  format:
    needs: build
    name: Self-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v17
        with:
          name: tilia
          authToken: '${{ secrets.CACHIX_TIILA_AUTH_TOKEN }}'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/cabal/packages
            !~/.cache/cabal/packages/hackage.haskell.org/01-index.*
          key: cabal-format-${{ hashFiles('corpora/hackage/hackage.manifest', 'cabal.project', 'tilia.cabal') }}
          restore-keys: |
            cabal-format-
            cabal-ghc9103-
      - uses: actions/cache@v6
        with:
          path: ~/.cache/tilia
          key: tilia-format-${{ hashFiles('corpora/hackage/hackage.manifest', 'cabal.project', 'tilia.cabal', 'src/**') }}
          restore-keys: |
            tilia-format-
            tilia-ghc9103-

      - name: Self-format
        run: |
          nix run .#format
          git diff --exit-code --color=always
